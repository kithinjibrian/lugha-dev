# The Lugha site (PRP-001, API-10): Caddy in front, the API behind it, and the
# sandbox image the API starts one container from per job. Sandbox containers
# are never services here: the API creates and removes them.
#
#   docker compose --profile sandbox build    # both images (lughac is built once)
#   docker compose up -d                      # caddy, api, cleanup
#
# Needs on the host: Docker with gVisor's runsc registered as a runtime, and in
# .env (or the environment):
#   DOCKER_GID   the group of /var/run/docker.sock (stat -c %g /var/run/docker.sock)
#   SITE_ADDRESS the domain to serve with HTTPS; leave unset for plain :80 locally
#   LUGHAC_REF   the lughac tag to build (default m154)

name: lugha

services:
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./services/ui-web/dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build:
      context: ./services/api
      target: api
      args:
        LUGHAC_REF: ${LUGHAC_REF:-m154}
    restart: unless-stopped
    # Reachable only by Caddy on the compose network: no published port.
    expose:
      - "8080"
    environment:
      SANDBOX_IMAGE: lugha-sandbox:${LUGHAC_REF:-m154}
      PORT: "8080"
    # The socket lets the API start sandbox containers. It is root-equivalent
    # on the host, so the API stays small and strict (PRP-001, security notes).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID to the group of /var/run/docker.sock}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Removes any sandbox container that has outlived its limits, in case the
  # API couldn't (deploy/cleanup).
  cleanup:
    image: docker:27.5.1-cli
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/cleanup"]
    volumes:
      - ./deploy/cleanup:/cleanup:ro
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Build-only: the image the API runs per job. Never started.
  sandbox:
    build:
      context: ./services/api
      target: sandbox
      args:
        LUGHAC_REF: ${LUGHAC_REF:-m154}
    image: lugha-sandbox:${LUGHAC_REF:-m154}
    profiles:
      - sandbox

volumes:
  caddy_data:
  caddy_config:
